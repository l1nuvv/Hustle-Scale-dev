ЦИЯ НАПРАВЛЕНИЯ, НЕ РЕАЛИЗОВАННАЯ ПОКУПКА</text><path d="M220 220H1380" stroke="#B7B2A6"/><text x="220" y="285" font-size="25" font-weight="400" fill="#202E37">Сейчас: один стол, ящик и временное хранение.</text><text x="220" y="349" font-size="25" font-weight="400" fill="#202E37">Следующий визуальный уровень: понятные зоны хранения,</text><text x="220" y="413" font-size="25" font-weight="400" fill="#202E37">отдельная зона упаковки и рабочий свет.</text><text x="220" y="477" font-size="25" font-weight="400" fill="#202E37">Условия открытия и цена ещё не определены.</text><text x="220" y="541" font-size="25" font-weight="400" fill="#202E37">Первая продажа сама по себе не меняет помещение.</text><rect x="220" y="640" width="590" height="54" fill="#C7C3B8"/><text x="238" y="675" font-size="22" font-weight="700" fill="#59636A">Покупка улучшения не реализована</text><text x="220" y="760" font-size="19" font-weight="400" fill="#59636A">Esc — назад · Tab / стрелки — фокус · Enter — действие</text><text x="24" y="880" font-size="16" font-weight="400" fill="#FFFFFF">HUSTLE &amp; SCALE · КОНЦЕПТ UI / НЕ КАДР UNITY</text></g></svg>