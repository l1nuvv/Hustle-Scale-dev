<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>Hustle &amp; Scale — design mockup</title><g font-family="Liberation Sans,Arial,sans-serif"><rect x="0" y="0" width="1600" height="900" fill="#EEE8D9"/><text x="60" y="80" font-size="34" font-weight="700" fill="#202E37">СТОЛ · РАБОЧАЯ ГИПОТЕЗА ДЛЯ ПРОВЕРКИ В UNITY</text><rect x="80" y="180" width="1440" height="380" fill="#A98255" stroke="#202E37" stroke-width="2"/><rect x="100" y="210" width="370" height="270" fill="#EEE8D9"/><text x="120" y="260" font-size="28" font-weight="700" fill="#202E37">ПРИЁМ</text><text x="120" y="305" font-size="18" font-weight="400" fill="#202E37">Ящик слева / вне зоны луча</text><rect x="490" y="210" width="590" height="270" fill="#EEE8D9"/><text x="510" y="260" font-size="28" font-weight="700" fill="#202E37">ПРОВЕРКА</text><text x="510" y="305" font-size="18" font-weight="400" fill="#202E37">Один фонарь / свободная поверхность</text><rect x="1100" y="210" width="400" height="270" fill="#EEE8D9"/><text x="1120" y="260" font-size="28" font-weight="700" fill="#202E37">ПОДГОТОВКА</text><text x="1120" y="305" font-size="18" font-weight="400" fill="#202E37">Расходники и будущая упаковка</text><g transform="translate(700 335) scale(1)"><rect x="10" y="20" width="80" height="88" fill="#365E73"/><rect x="23" y="0" width="54" height="25" fill="#202E37"/><rect x="31" y="7" width="38" height="14" fill="#EEE8D9"/><rect x="18" y="28" width="64" height="69" fill="#202E37"/><rect x="24" y="34" width="52" height="56" fill="#D8D5BA"/><rect x="3" y="102" width="34" height="14" fill="#202E37"/><rect x="63" y="102" width="34" height="14" fill="#202E37"/></g><rect x="750" y="650" width="110" height="70" fill="#202E37"/><text x="80" y="855" font-size="24" font-weight="400" fill="#202E37">Камера 1,65 м · FOV 70° город / 75° sandbox</text><path d="M805 650L750 465" stroke="#963E35" stroke-width="2"/><text x="80" y="635" font-size="24" font-weight="400" fill="#202E37">Факты: E ≤ 2,5 м, ближайший коллайдер блокирует луч.</text><text x="80" y="680" font-size="24" font-weight="400" fill="#202E37">Фонарь города: 0,30 × 0,48 × 0,26 м (бокс).</text><text x="80" y="725" font-size="24" font-weight="400" fill="#202E37">Рекомендация: проверять с 0,75–1,10 м, без автозума.</text><text x="80" y="770" font-size="24" font-weight="400" fill="#202E37">Декор не пересекает луч, хват, проход и зону установки.</text></g></svg>