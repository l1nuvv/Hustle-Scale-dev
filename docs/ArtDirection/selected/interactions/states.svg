<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>Hustle &amp; Scale — design mockup</title><g font-family="Liberation Sans,Arial,sans-serif"><rect x="0" y="0" width="1600" height="900" fill="#EEE8D9"/><text x="60" y="80" font-size="36" font-weight="700" fill="#202E37">СОСТОЯНИЯ · ЗНАНИЕ ИГРОКА ОТДЕЛЕНО ОТ ВЕЩИ</text><g transform="translate(155 220) scale(1.4)"><rect x="10" y="20" width="80" height="88" fill="#365E73"/><rect x="23" y="0" width="54" height="25" fill="#202E37"/><rect x="31" y="7" width="38" height="14" fill="#EEE8D9"/><rect x="18" y="28" width="64" height="69" fill="#202E37"/><rect x="24" y="34" width="52" height="56" fill="#D8D5BA"/><rect x="3" y="102" width="34" height="14" fill="#202E37"/><rect x="63" y="102" width="34" height="14" fill="#202E37"/></g><text x="70" y="470" font-size="46" font-weight="700" fill="#202E37">?</text><text x="70" y="530" font-size="24" font-weight="700" fill="#202E37">НЕ ПРОВЕРЕН</text><text x="70" y="572" font-size="20" font-weight="400" fill="#202E37">Одинаковый корпус</text><g transform="translate(545 220) scale(1.4)"><rect x="10" y="20" width="80" height="88" fill="#365E73"/><rect x="23" y="0" width="54" height="25" fill="#202E37"/><rect x="31" y="7" width="38" height="14" fill="#EEE8D9"/><rect x="18" y="28" width="64" height="69" fill="#202E37"/><rect x="24" y="34" width="52" height="56" fill="#D8D5BA"/><rect x="3" y="102" width="34" height="14" fill="#202E37"/><rect x="63" y="102" width="34" height="14" fill="#202E37"/></g><text x="460" y="470" font-size="46" font-weight="700" fill="#202E37">✓</text><text x="460" y="530" font-size="24" font-weight="700" fill="#202E37">ПРОВЕРЕН</text><text x="460" y="572" font-size="20" font-weight="400" fill="#202E37">Устойчивый свет</text><g transform="translate(935 220) scale(1.4)"><rect x="10" y="20" width="80" height="88" fill="#365E73"/><rect x="23" y="0" width="54" height="25" fill="#202E37"/><rect x="31" y="7" width="38" height="14" fill="#EEE8D9"/><rect x="18" y="28" width="64" height="69" fill="#202E37"/><rect x="24" y="34" width="52" height="56" fill="#D8D5BA"/><rect x="3" y="102" width="34" height="14" fill="#202E37"/><rect x="63" y="102" width="34" height="14" fill="#202E37"/></g><text x="850" y="470" font-size="46" font-weight="700" fill="#202E37">!</text><text x="850" y="530" font-size="24" font-weight="700" fill="#202E37">ДЕФЕКТ БАТАРЕИ</text><text x="850" y="572" font-size="20" font-weight="400" fill="#202E37">Кратко загорелся и погас</text><g transform="translate(1325 220) scale(1.4)"><rect x="10" y="20" width="80" height="88" fill="#365E73"/><rect x="23" y="0" width="54" height="25" fill="#202E37"/><rect x="31" y="7" width="38" height="14" fill="#EEE8D9"/><rect x="18" y="28" width="64" height="69" fill="#202E37"/><rect x="24" y="34" width="52" height="56" fill="#D8D5BA"/><rect x="3" y="102" width="34" height="14" fill="#202E37"/><rect x="63" y="102" width="34" height="14" fill="#202E37"/></g><text x="1240" y="470" font-size="46" font-weight="700" fill="#202E37">↻</text><text x="1240" y="530" font-size="24" font-weight="700" fill="#202E37">ПОСЛЕ РЕМОНТА</text><text x="1240" y="572" font-size="20" font-weight="400" fill="#202E37">Повторить проверку</text><text x="60" y="695" font-size="25" font-weight="400" fill="#202E37">Косметический износ не раскрывает диагноз. Включение F не заменяет тест.</text><text x="60" y="747" font-size="25" font-weight="400" fill="#202E37">Звук + подпись подтверждают результат; красный и зелёный не единственные признаки.</text><text x="60" y="799" font-size="25" font-weight="400" fill="#202E37">0,12–0,25 с на смену представления; длительность теста — параметр текущей механики.</text></g></svg>